name: JSL robot tests
# Runs the robot against a fake portal and a fake app (no real login, no real data) whenever the robot changes.
on:
  push:
    paths: ["jsl-worker/**", ".github/workflows/jsl-*.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jsl-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node test/run-tests.mjs
